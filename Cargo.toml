[package]
name = "zegraph-api"
version = "1.0.0"
edition = "2024"

[dependencies]
poem = { version = "3.1.12", features = ["session", "multipart"] }
# Pinned: 5.1.9+ registers path params positionally (`:param0`), so the custom
# FromRequest extractors that read them by name via `raw_path_param` get None and 400.
# This pin only holds the facade; the rewrite lives in poem-openapi-derive, and 5.1.8
# accepts derive ^5.1.8. Cargo.lock therefore also pins poem-openapi-derive =5.1.8 and
# darling =0.20.10 (0.20.11 rejects derive 5.1.8's `with = "..."`). Drifting either
# breaks the build rather than failing silently.
poem-openapi={version = "=5.1.8", features = ["swagger-ui", "chrono"]}
tokio={ version = "1.52.3", features = ["rt-multi-thread", "signal"] }
sqlx = { version = "0.8.6", features = [ "runtime-tokio", "postgres", "time", "uuid", "json"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing-subscriber= { version = "0.3.23", features = ["env-filter"] }
dotenv="0.15.0"
serde="1.0.228"
serde_json = "1.0.150"
reqwest={version = "0.13.4", default-features = false, features = ["json", "query", "native-tls", "charset", "http2", "system-proxy"]}
tracing = "0.1.44"
aws-credential-types = "1.3.0"
aws-sdk-s3 = { version = "1.138.0", features = ["behavior-version-latest"] }
deadpool-redis = { version = "0.23.0", features = ["rt_tokio_1"] }
redis="1.4.0"
futures = "0.3.32"
time = { version = "0.3.53", features = ["formatting", "parsing"] }
serde_macros = { path = "./serde_macros" }
image = "0.25.10"
url = "2.5.8"
rust-fuzzy-search = { git = "https://gitlab.com/EnricoCh/rust-fuzzy-search"}
uri-pattern-matcher = "0.1.4"
async-stream = "0.3.6"
rand = "0.10.2"
moka= { version = "0.12.15", features = ["future"] }
indexmap = "2.14.0"
async-trait = "0.1.89"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
web-push = "0.11.0"
base64 = "0.22.1"

[features]
docker=["openssl"]

[dependencies.openssl]
features = ["vendored"]
optional = true
version = "0.10.81"
[build-dependencies]
sha256 = "1.6.0"

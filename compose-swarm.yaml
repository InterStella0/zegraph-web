x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  reverse:
    image: interstella0/ze-graph:reverse
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-backend}
      FRONTEND_HOST: ${FRONTEND_HOST:-frontend}
      QGIS_HOST: ${QGIS_HOST:-qgis-server}
    volumes:
      # Maps/characters are served from R2 in prod, so no local bind mounts here.
      - ${PUBLIC_FILES_PATH:-/front-gfl/public}:/var/www/public/any:ro
    networks:
      - default
    logging: *default-logging
    ports:
      - "51020:80"
    deploy:
      placement:
        constraints:
          - node.role == manager

  frontend:
    image: interstella0/ze-graph:frontend
    volumes:
      - thumbnails:/var/www/thumbnails:ro
      - tile_cache:/var/cache/nginx/qgis_tiles
    logging: *default-logging
    deploy:
      replicas: 2
#      placement:
#        # Cap 1 replica per node: when both nodes are up you get 1 each (uses
#        # spare worker compute); when the worker is down only 1 runs on the
#        # manager instead of both stacking onto the small VPS.
#        max_replicas_per_node: 1
#        preferences:
#          - spread: node.hostname

      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "2"
          memory: 3G
        reservations:
          cpus: "1"
          memory: 2048M
    networks:
      - default

  backend:
    image: interstella0/ze-graph:backend
    user: "10001:956"
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CACHE_THUMBNAIL: /var/www/thumbnails
      STORE_UPLOAD: /var/www/storage
      STORAGE_BACKEND: ${STORAGE_BACKEND}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      # VAPID keys delivered as Swarm secrets, mounted under /run/secrets.
      VAPID_PRIVATE_KEY_PATH: /run/secrets/vapid_private
      VAPID_PUBLIC_KEY_PATH: /run/secrets/vapid_public
    secrets:
      - vapid_private
      - vapid_public
    volumes:
      # Maps/characters use the R2 storage backend in prod; vapids via secrets.
      - thumbnails:/var/www/thumbnails
    logging: *default-logging
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.0-alpine
    volumes:
      - redis-data:/data
      - ${REDIS_CONF_PATH}:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    logging: *default-logging
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '1'
          memory: 3G
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  pfp-provider:
    image: interstella0/ze-graph:pfp-provider
    environment:
      REDIS_URL: ${REDIS_URL}
      STEAM_API_KEY: ${STEAM_API_KEY}
    logging: *default-logging
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  qgis-server:
    image: interstella0/ze-graph:qgis-server
    environment:
      LANG: en_EN.UTF-8
      QGIS_PROJECT_FILE: /home/qgis/project/project.qgz
      QGIS_SERVER_LOG_LEVEL: 0
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    logging: *default-logging
    deploy:
      replicas: 2
      placement:
        # Same as frontend: 1 per node, so the manager never has to run both
        # qgis replicas when the worker is offline.
        max_replicas_per_node: 1
        preferences:
          - spread: node.hostname
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  thumbnails:
  tile_cache:
  redis-data:

secrets:
  # Created out-of-band on the manager (see deploy notes); not stored in git.
  vapid_private:
    external: true
  vapid_public:
    external: true

networks:
  default:
    driver: overlay
    driver_opts:
      # Tailscale's interface MTU is ~1280; the overlay defaults to 1450, so
      # VXLAN-over-Tailscale fragments/drops large packets ("small requests
      # work, big responses hang"). Lower it to fit inside Tailscale.
      com.docker.network.driver.mtu: "1200"
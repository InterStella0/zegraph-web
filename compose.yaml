x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  reverse:
    image: interstella0/ze-graph:reverse
    restart: always
    build:
      context: nginx
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-backend}
      FRONTEND_HOST: ${FRONTEND_HOST:-frontend}
      QGIS_HOST: ${QGIS_HOST:-qgis-server}
    volumes:
      - ${STORAGE_PATH}/maps:/var/www/frontend/public:ro
      - ${STORAGE_PATH}/characters:/var/www/characters:ro
      - ${STORAGE_PATH}/communities:/var/www/communities:ro
      - ${PUBLIC_FILES_PATH:-/front-ze/public}:/var/www/public/any:ro
    networks:
      - default
    ports:
      - "51020:80"
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    image: interstella0/ze-graph:frontend
    restart: always
    build:
      context: front-ze
      args:
        BUILD_ENV: production
        R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
        DISCORD_CLIENT_ID: ${DISCORD_AUTH2_CLIENT_ID}
        NEXT_PUBLIC_DISCORD_AUTH2_REDIRECT_URI: ${DISCORD_AUTH2_REDIRECT_URI}
        NEXTAUTH_URL: ${CLIENT_AUTH_REDIRECT_URI}
        DISCORD_CLIENT_SECRET: ${DISCORD_AUTH2_CLIENT_SECRET}
        STEAM_SECRET: ${STEAM_API_KEY}
        NEXT_PUBLIC_DOMAIN: ${NEXT_PUBLIC_DOMAIN}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        FRONTEND_URL: ${FRONTEND_URL}
        ANALYZE: ${ANALYZE}
        NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${NEXT_PUBLIC_ADSENSE_CLIENT_ID}
        NEXT_PUBLIC_ADSENSE_AD_SLOT: ${NEXT_PUBLIC_ADSENSE_AD_SLOT}
        NEXT_PUBLIC_AD_SHOW: ${NEXT_PUBLIC_AD_SHOW}
        # Exported by deployment/build-meta.sh; empty on a bare `docker compose build`, which
        # simply hides the footer's build line.
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    volumes:
      - thumbnails:/var/www/thumbnails:ro
      - tile_cache:/var/cache/nginx/qgis_tiles
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
  backend:
    image: interstella0/ze-graph:backend
    restart: always
    user: "10001:956"
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env
    build:
      context: .
      target: final
      args:
        DATABASE_URL: ${DATABASE_URL}
    environment:
      ROLE: api
      DATABASE_URL: ${DATABASE_URL}
      CACHE_THUMBNAIL: /var/www/thumbnails
      STORE_UPLOAD: /var/www/storage
      QGIS_WMS_URL: http://${REVERSE_HOST:-reverse}/qgis-server
    volumes:
      - thumbnails:/var/www/thumbnails
      - ${STORAGE_PATH}:/var/www/storage:rw
      - ${VAPIDS_PATH}:/app/vapids:ro
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
  # Same image as backend, other half of the split: consumes the refresh queues and runs the
  # push/precalculate loops. Keep this at one replica -- its heavy-job semaphore is the global
  # concurrency limit, and a second replica would silently double it.
  worker:
    image: interstella0/ze-graph:backend
    restart: always
    user: "10001:956"
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env
    build:
      context: .
      target: final
      args:
        DATABASE_URL: ${DATABASE_URL}
    environment:
      ROLE: worker
      HEAVY_JOB_CONCURRENCY: "${HEAVY_JOB_CONCURRENCY:-2}"
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_API_BASE: http://backend:3000
    volumes:
      - ${VAPIDS_PATH}:/app/vapids:ro
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    restart: always
    image: redis:8.8-alpine
    volumes:
      - redis-data:/data
      - ${REDIS_CONF_PATH}:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 3G
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
  pfp-provider:
    image: interstella0/ze-graph:pfp-provider
    restart: always
    build:
      context: ./pfp-provider
    environment:
      REDIS_URL: ${REDIS_URL}
      STEAM_API_KEY: ${STEAM_API_KEY}
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  qgis-server:
    image: interstella0/ze-graph:qgis-server
    build:
      context: ./qgis-server
    environment:
      LANG: en_EN.UTF-8
      QGIS_PROJECT_FILE: /home/qgis/project/project.qgz
      QGIS_SERVER_LOG_LEVEL: 0
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  thumbnails:
  tile_cache:
  redis-data:

networks:
  default:

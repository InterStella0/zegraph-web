name: Deploy Label

# Asks Jev (TypeSafe's decision model) whether merging this PR needs a production deploy, plus one
# yes/no question per category label in .github/pr-labels.json. The deploy verdict is recorded as
# exactly one of `deploy` / `not deploy`; deployment.yml reads it at merge time and skips the deploy
# only on `not deploy`. Any label a human has ever added or removed on the PR is left alone.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      PR: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The pull_request ref is the merge commit, so HEAD^1 is the base and the diff below is
          # exactly what merging would change.
          fetch-depth: 2

      - name: Ensure the labels exist
        shell: bash
        run: |
          gh label create "deploy" --color 0e8a16 --description "Merging this PR deploys to production" 2>/dev/null || true
          gh label create "not deploy" --color cfd3d7 --description "Merging this PR skips the production deploy" 2>/dev/null || true
          jq -r '.labels[] | [.name, .color, .description] | @tsv' .github/pr-labels.json |
            while IFS=$'\t' read -r name color description; do
              gh label create "$name" --color "$color" --description "$description" 2>/dev/null || true
            done

      - name: Ask Jev and apply labels
        shell: bash
        run: |
          set -euo pipefail

          human=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/timeline" --paginate \
            --jq '.[] | select((.event=="labeled" or .event=="unlabeled") and (.actor.login | endswith("[bot]") | not)) | .label.name' |
            sort -u)
          current=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          is_human() { grep -qxF "$1" <<< "$human"; }
          has() { grep -qxF "$1" <<< "$current"; }

          add=()
          remove=()
          want() {
            local name=$1 yes=$2
            if is_human "$name"; then
              echo "  $name: set by a human, leaving it"
            elif [[ "$yes" == 1 ]] && ! has "$name"; then
              add+=(--add-label "$name")
            elif [[ "$yes" == 0 ]] && has "$name"; then
              remove+=(--remove-label "$name")
            fi
          }
          want_deploy() {
            if is_human "deploy" || is_human "not deploy"; then
              echo "  deploy: set by a human, leaving it"
              return
            fi
            want "deploy" "$1"
            want "not deploy" $((1 - $1))
          }
          apply() {
            if (( ${#add[@]} + ${#remove[@]} )); then
              gh pr edit "$PR" "${add[@]}" "${remove[@]}"
            fi
          }

          if [[ -z "$JEV_API_KEY" ]]; then
            echo "::warning::JEV_API_KEY secret is not set, labelling deploy without asking Jev"
            want_deploy 1; apply; exit 0
          fi

          # Jev takes ~32k tokens of state, so lockfile bodies are dropped (they still appear in
          # `files`) and whitespace-only hunks are ignored before the diff is capped.
          git diff --name-status HEAD^1 HEAD > files.txt
          git diff -w --ignore-blank-lines --unified=2 HEAD^1 HEAD -- . ':(exclude)*.lock' > diff.full
          head -c 60000 diff.full > diff.txt
          truncated=$([[ $(wc -c < diff.full) -gt 60000 ]] && echo true || echo false)

          jq -n \
            --arg title "$PR_TITLE" \
            --arg body "${PR_BODY:0:3000}" \
            --rawfile files files.txt \
            --rawfile diff diff.txt \
            --argjson truncated "$truncated" \
            --slurpfile defs .github/pr-labels.json \
            '{
              model: "jev-latest",
              state: {title: $title, body: $body, files: $files, diff: $diff, diff_truncated: $truncated},
              questions: (
                {deploy: ($defs[0].deploy + {type: "noul"})}
                + ($defs[0].labels | to_entries
                   | map({key: "label_\(.key)", value: {type: "noul", instructions: .value.instructions, criteria: .value.criteria}})
                   | from_entries)
              )
            }' > request.json

          if ! curl -sS --fail-with-body --retry 4 --retry-all-errors --max-time 60 \
              https://api.typesafe.ai/v1/systemone \
              -H "Authorization: Bearer $JEV_API_KEY" -H "Content-Type: application/json" \
              --data @request.json > response.json; then
            echo "::warning::Jev request failed, labelling deploy: $(head -c 500 response.json)"
            want_deploy 1; apply; exit 0
          fi

          # Biased towards deploying: a skipped deploy that was needed is far worse than a spare one.
          p_deploy=$(jq -r '.answers.deploy.noul' response.json)
          echo "deploy: p=$p_deploy"
          want_deploy "$(jq -n --argjson p "$p_deploy" 'if $p >= 0.25 then 1 else 0 end')"

          while IFS=$'\t' read -r name p; do
            echo "$name: p=$p"
            want "$name" "$(jq -n --argjson p "$p" 'if $p >= 0.5 then 1 else 0 end')"
          done < <(jq -r --slurpfile defs .github/pr-labels.json \
            '. as $r | $defs[0].labels | to_entries[] | [.value.name, $r.answers["label_\(.key)"].noul] | @tsv' \
            response.json)

          apply
          {
            echo "### Jev labels for #$PR"
            echo
            echo "| question | p(yes) |"
            echo "|---|---|"
            jq -r --slurpfile defs .github/pr-labels.json \
              '. as $r | (["deploy", $r.answers.deploy.noul], ($defs[0].labels | to_entries[] | [.value.name, $r.answers["label_\(.key)"].noul])) | "| \(.[0]) | \(.[1]) |"' \
              response.json
          } >> "$GITHUB_STEP_SUMMARY"

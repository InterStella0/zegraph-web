name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Absolute path on the machine deploying real production .env, kept outside the
  # repo so actions/checkout cannot wipe it. Set as the ENV_LOCATION repository
  # variable (Settings -> Secrets and variables -> Actions -> Variables).
  ENV_SOURCE: ${{ vars.ENV_LOCATION }}

jobs:
  # Skips the deploy when the merged PR carries the `documentation` label, which deploy-label.yml
  # applies while the PR is open. Every unexpected condition here fails open: a deploy that should
  # have run but silently did not is far worse than a redundant one.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "manual dispatch — deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" > pulls.json; then
            echo "pr lookup failed — deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # This endpoint also returns *open* prs that merely contain the commit, so match the
          # merge commit exactly rather than trusting merged_at alone. A direct push to main
          # matches nothing and deploys, which is right — there was no PR to judge it.
          labels=$(jq -r --arg sha "$GITHUB_SHA" \
            '.[] | select(.merged_at != null and .merge_commit_sha == $sha) | .labels[].name' \
            pulls.json)

          if grep -qx 'documentation' <<< "$labels"; then
            echo "merged pr is labelled documentation — skipping deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    # Deliberately not `== 'true'`: if the gate job itself crashes its output is empty, and that
    # must still deploy rather than silently skip.
    if: ${{ !cancelled() && needs.gate.outputs.deploy != 'false' }}
    runs-on: [self-hosted, stella-pc]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Stage production .env
        shell: bash
        run: |
          if [[ -z "$ENV_SOURCE" ]]; then
            echo "error: ENV_LOCATION repository variable is not set" >&2
            exit 1
          fi
          if [[ ! -f "$ENV_SOURCE" ]]; then
            echo "error: $ENV_SOURCE not found on this runner" >&2
            exit 1
          fi
          cp "$ENV_SOURCE" .env

      - name: Configure ssh access to the deploy target
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          for v in DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS DEPLOY_SSH_HOST DEPLOY_SSH_USER; do
            if [[ -z "${!v}" ]]; then
              echo "error: $v secret is empty or not set" >&2
              exit 1
            fi
          done
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          rm -rf "$ssh_dir"
          mkdir -p "$ssh_dir"
          chmod 700 "$ssh_dir"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/id_deploy"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          cat > "$ssh_dir/config" <<EOF
          Host server
            HostName $DEPLOY_SSH_HOST
            User $DEPLOY_SSH_USER
            Port ${DEPLOY_SSH_PORT:-22}
            IdentityFile $ssh_dir/id_deploy
            IdentitiesOnly yes
            UserKnownHostsFile $ssh_dir/known_hosts
            StrictHostKeyChecking yes
          EOF
          echo "SSH_CONFIG_FILE=$ssh_dir/config" >> "$GITHUB_ENV"

      - name: Build, push, and deploy
        shell: bash
        run: bash ./deployment/deploy-scripts.sh

      - name: Remove staged secrets
        if: always()
        shell: bash
        run: |
          rm -f .env
          rm -rf "$RUNNER_TEMP/deploy-ssh"

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Absolute path on the runner to the production .env the images are built with (the frontend
  # bakes NEXT_PUBLIC_* in at build time), kept outside the repo so actions/checkout cannot wipe
  # it. The runtime env lives in Dokploy. Set as the ENV_LOCATION repository variable
  # (Settings -> Secrets and variables -> Actions -> Variables).
  ENV_SOURCE: ${{ vars.ENV_LOCATION }}

jobs:
  # Skips the deploy only when the merged PR carries the `not deploy` label, which deploy-label.yml
  # applies while the PR is open. Every unexpected condition here fails open: a deploy that should
  # have run but silently did not is far worse than a redundant one.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "manual dispatch — deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # This endpoint also returns *open* prs that merely contain the commit, so match the
          # merge commit exactly rather than trusting merged_at alone. A direct push to main
          # matches nothing and deploys, which is right — there was no PR to judge it.
          # GitHub links the merge commit to its PR a few seconds after the push, so retry
          # before concluding there is none.
          pr="" head=""
          for i in $(seq 6); do
            if ! gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" > pulls.json; then
              echo "pr lookup failed — deploying"
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            read -r pr head < <(jq -r --arg sha "$GITHUB_SHA" \
              '.[] | select(.merged_at != null and .merge_commit_sha == $sha) | "\(.number) \(.head.sha)"' \
              pulls.json | head -n1) || true
            [[ -n "$pr" ]] && break
            [[ $i -lt 6 ]] && sleep 5
          done

          if [[ -z "$pr" ]]; then
            echo "no merged pr for this commit — deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Merging straight after a push used to beat the labeler, so the gate read no label and
          # deployed. Wait for any labeler run on the merged head to finish before reading.
          for _ in $(seq 60); do
            pending=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-label.yml \
              --commit "$head" --json status --jq '[.[] | select(.status != "completed")] | length' \
              || echo 0)
            [[ "$pending" == "0" ]] && break
            echo "waiting for the deploy labeler on #$pr ($pending run(s) pending)"
            sleep 10
          done

          labels=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' || true)
          echo "#$pr labels: $(paste -sd, <<< "$labels")"

          if grep -qxF 'not deploy' <<< "$labels" && ! grep -qxF 'deploy' <<< "$labels"; then
            echo "merged pr #$pr is labelled not deploy — skipping deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    # Deliberately not `== 'true'`: if the gate job itself crashes its output is empty, and that
    # must still deploy rather than silently skip.
    if: ${{ !cancelled() && needs.gate.outputs.deploy != 'false' }}
    runs-on: [self-hosted, stella-pc]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Stage production .env
        shell: bash
        run: |
          if [[ -z "$ENV_SOURCE" ]]; then
            echo "error: ENV_LOCATION repository variable is not set" >&2
            exit 1
          fi
          if [[ ! -f "$ENV_SOURCE" ]]; then
            echo "error: $ENV_SOURCE not found on this runner" >&2
            exit 1
          fi
          cp "$ENV_SOURCE" .env

      - name: Build, push, and deploy
        shell: bash
        env:
          # Dokploy is only reachable over the tailnet, which is why this job stays on stella-pc.
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: bash ./deployment/deploy-scripts.sh

      - name: Remove staged secrets
        if: always()
        shell: bash
        run: rm -f .env

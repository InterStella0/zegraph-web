[package]
name = "zegraph-pfp-provider"
version = "0.1.1"
edition = "2024"

[dependencies]
tracing-subscriber= { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "sync"] }
thiserror = "2.0.12"
tracing = "0.1.44"
deadpool-redis = { version = "0.23.0", features = ["rt_tokio_1"] }
redis= {  version = "1.4.0" }
poem="3.1.12"
poem-openapi={version = "5.1.16", features = ["swagger-ui", "chrono"]}
async-trait = "0.1.89"
anyhow = "1.0.98"
serde_json = "1.0.150"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "native-tls", "charset", "http2", "system-proxy"] }
regex = "1.11.1"
serde="1.0.228"
moka = { version = "0.12.15", features = ["future"] }

[features]
docker=["openssl"]

[dependencies.openssl]
features = ["vendored"]
optional = true
version = "0.10.81"
services:
  exposing:
    image: nginx:alpine
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ${NGINX_DEV_CONF_PATH}:/etc/nginx/conf.d/default.conf
      - ${NGINX_BASE_CONF_PATH}:/etc/nginx/nginx.conf
      - thumbnails:/var/www/thumbnails:ro
      - tile_cache:/var/cache/nginx/qgis_tiles
      - ${STORAGE_PATH}/maps:/var/www/frontend/public:ro
      - ${STORAGE_PATH}/characters:/var/www/characters:ro
      - ${STORAGE_PATH}/communities:/var/www/communities:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
  frontend:
    restart: always
    build:
      context: ./front-ze
      dockerfile: dev.Dockerfile
      args:
        BUILD_ENV: development
        DISCORD_CLIENT_ID: ${DISCORD_AUTH2_CLIENT_ID}
        NEXT_PUBLIC_DISCORD_AUTH2_REDIRECT_URI: ${DISCORD_AUTH2_REDIRECT_URI}
        NEXTAUTH_URL: ${CLIENT_AUTH_REDIRECT_URI}
        DISCORD_CLIENT_SECRET: ${DISCORD_AUTH2_CLIENT_SECRET}
        STEAM_SECRET: ${STEAM_API_KEY}
        NEXT_PUBLIC_DOMAIN: ${NEXT_PUBLIC_DOMAIN}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST}
        FRONTEND_URL: http://frontend:5173
        ANALYZE: ${ANALYZE}
        NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${NEXT_PUBLIC_ADSENSE_CLIENT_ID}
        NEXT_PUBLIC_ADSENSE_AD_SLOT: ${NEXT_PUBLIC_ADSENSE_AD_SLOT}
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    volumes:
      # next.config.ts reads HEAD from here for the footer's build line. Mounted rather than passed
      # as a build arg so a plain `docker compose -f compose.dev.yaml up --build` still shows the
      # commit; .dockerignore keeps .git out of the image itself.
      - ./.git:/app/.git:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://frontend:5173" ]
      interval: 10s
      timeout: 5s
      retries: 3
    develop:
      watch:
        - action: sync
          path: ./front-ze
          target: /app/
          ignore:
            - node_modules
        - action: rebuild
          path: vite.config.js
        - action: sync+restart
          path: .
          target: /app/other
          ignore:
            - thumbs
            - assets
            - front-ze
  backend:
    restart: always
    user: "10001:956"
    env_file:
      - .env
    build:
      context: .
      target: final
      args:
        DATABASE_URL: ${DATABASE_URL}
    environment:
      ROLE: api
      DATABASE_URL: ${DATABASE_URL}
      CACHE_THUMBNAIL: /var/www/thumbnails
      STORE_UPLOAD: /var/www/storage
      # The dev proxy is `exposing`; in compose.yaml/swarm it is `reverse`.
      QGIS_WMS_URL: http://exposing/qgis-server
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://backend:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - thumbnails:/var/www/thumbnails
      - ${STORAGE_PATH}:/var/www/storage:rw
      - ${VAPIDS_PATH}:/app/vapids:ro
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - front-ze
            - target
            - thumbs
            - db.sql
  # Same image as backend, other half of the split. Defined in full rather than relying on the
  # compose.yaml merge so this file also stands on its own.
  worker:
    restart: always
    user: "10001:956"
    env_file:
      - .env
    build:
      context: .
      target: final
      args:
        DATABASE_URL: ${DATABASE_URL}
    environment:
      ROLE: worker
      DATABASE_URL: ${DATABASE_URL}
      # The precalculate loops warm caches by poking API endpoints, which are no longer in this
      # process, so they have to reach the API over the network.
      INTERNAL_API_BASE: http://backend:3000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://worker:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      # No STORAGE_PATH mount: uploads and the .tmp cleanup stay with the API. VAPIDs are needed
      # because this is the process that actually sends push notifications.
      - ${VAPIDS_PATH}:/app/vapids:ro
    # Without this, a code change rebuilds backend and leaves the worker running stale code.
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - front-ze
            - target
            - thumbs
            - db.sql
  pfp-provider:
    build:
      context: ./pfp-provider
    environment:
      REDIS_URL: ${REDIS_URL}
      STEAM_API_KEY: ${STEAM_API_KEY}
  redis:
    restart: always
    image: redis:8.8-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
  qgis-server:
    volumes:
      - ${QGIS_PROJECT_PATH}:/home/qgis/project
    build:
      context: ./qgis-server
    environment:
      LANG: en_EN.UTF-8
      QGIS_PROJECT_FILE: /home/qgis/project/project.qgz
      QGIS_SERVER_LOG_LEVEL: 0
      DEBUG: 1
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: UTC


volumes:
  thumbnails:
  tile_cache:
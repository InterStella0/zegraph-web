server {
    listen 80;

    # Docker internal DNS resolver - allows runtime hostname resolution
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Define upstream hosts as variables to force runtime DNS resolution
    # These are substituted from environment variables at startup
    set $backend_upstream "${BACKEND_HOST}:3000";
    set $frontend_upstream "${FRONTEND_HOST}:3000";
    set $qgis_upstream "${QGIS_HOST}:9993";

    location ~ ^/data/api/graph/([^/]+)/players$ {
        limit_req zone=heavy_rate burst=2 nodelay;
        limit_req_status 429;
        add_header Cache-Control $api_edge_cache;

        proxy_pass http://$backend_upstream/graph/$1/players$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/data/api/graph/([^/]+)/event_count$ {
        limit_req zone=semi_heavy_rate burst=6 nodelay;
        limit_req_status 429;
        add_header Cache-Control $api_edge_cache;

        proxy_pass http://$backend_upstream/graph/$1/event_count$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/data/api/graph/([^/]+)/unique_players$ {
        limit_req zone=semi_heavy_rate burst=6 nodelay;
        limit_req_status 429;
        add_header Cache-Control $api_edge_cache;

        proxy_pass http://$backend_upstream/graph/$1/unique_players$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /data/api/events/data-updates {
        rewrite ^/data/api/(.*)$ /$1 break;

        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /data/api/ {
        # Proxy caching for API responses
        proxy_cache api_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_bypass $http_cache_control;

        # The API answers HTTP 200 even when the body says "still calculating", so status alone
        # cannot tell a real answer from a placeholder. The backend marks the latter with
        # X-Calculating (see CALCULATING_HEADER in src/api_models/common.rs); without this, a
        # not-ready response was cached for the full 5m while the page retried every 10s.
        proxy_no_cache $upstream_http_x_calculating;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control $api_edge_cache;

        # Capture the path after /data/api/
        rewrite ^/data/api/(.*)$ /$1 break;

        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for backend requests
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Connection optimizations
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering on;
    }

    location /thumbnails/ {
        root /var/www;
        try_files $uri $uri/ @backend;

        # Cache static files
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location @backend {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/tiles/(?<layer>[^/]+)/(?<z>\d+)/(?<x>\d+)/(?<y>\d+)\.png$ {
        set $query "layer=$layer&tilematrixset=EPSG:3857&Service=WMTS&Request=GetTile&Format=image/png&TileMatrix=$z&TileCol=$x&TileRow=$y";

        rewrite ^ /qgis-server?$query break;
        fastcgi_cache qgis_cache;
        fastcgi_cache_key "$uri?$query";

        fastcgi_cache_valid 200 365d;
        fastcgi_cache_valid any 5m;
        fastcgi_cache_lock on;

        fastcgi_ignore_headers Cache-Control;
        add_header X-Cache-Status $upstream_cache_status;

        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /qgis-server;
        fastcgi_pass $qgis_upstream;
    }

    location /qgis-server {
      proxy_buffers 16 16k;
      proxy_buffer_size 16k;
      gzip off;
      include fastcgi_params;
      fastcgi_pass $qgis_upstream;
    }

    location = /wms/player_live/now {
        set $query "LAYERS=player_server_mapped&FORMAT=image/png&TRANSPARENT=true&VERSION=1.1.1&$args";

        rewrite ^ /qgis-server?$query break;
        fastcgi_cache qgis_live_cache;
        fastcgi_cache_key "$uri?$query";

        fastcgi_cache_valid 200 5m;
        fastcgi_cache_valid any 30s;
        fastcgi_cache_lock on;

        fastcgi_ignore_headers Cache-Control;
        add_header X-Cache-Status $upstream_cache_status;

        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /qgis-server;
        fastcgi_pass $qgis_upstream;
    }

    location ~* ^/models/maps/(.+\.(gltf|glb|png|jpg|jpeg))$ {
        alias /var/www/frontend/public/$1;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location ~* ^/models/characters/(.+\.(gltf|glb|png|jpg|jpeg))$ {
        alias /var/www/characters/$1;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location ~* ^/models/communities/(.+\.(png|jpg|jpeg|webp))$ {
        alias /var/www/communities/$1;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location = /ads.txt {
        root /var/www/public/any;
        try_files /ads.txt =404;
        expires 1d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Increase timeouts for PostHog assets
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Better buffering for larger responses
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
# Client authentication for the REPLICA (installed to $CONFDIR/pg_hba.conf).
# Local-only access — the replica is queried from the same machine. There is no
# remote inbound access here; the replica is a CLIENT to the primary, not a server
# for external clients.
#
# TYPE  DATABASE  USER  ADDRESS         METHOD
local   all       all                   trust
host    all       all   127.0.0.1/32    trust
host    all       all   ::1/128         trust

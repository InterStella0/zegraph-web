# Replica static config — installed to $CONFDIR/postgresql.conf
# (default: /var/lib/postgres/replica-conf/postgresql.conf).
#
# This file lives OUTSIDE the data directory on purpose: a rebuild
# (pg_basebackup wiping the data dir) can never delete it, and no script can
# forget to recreate it. The replica is started with:
#     postgres --config-file=/var/lib/postgres/replica-conf/postgresql.conf
# and finds its data via the data_directory setting below.
#
# Connection settings (primary_conninfo / primary_slot_name) are intentionally
# NOT here — they live in postgresql.auto.conf INSIDE the data dir and are
# regenerated by `pg_basebackup -R` on every rebuild.

data_directory = '/var/lib/postgres/replica'
hba_file       = '/var/lib/postgres/replica-conf/pg_hba.conf'
ident_file     = '/var/lib/postgres/replica-conf/pg_ident.conf'

# Replica listens on 5433 so it can coexist with a normal local Postgres on 5432.
port = 5433

# Required for a standby that serves read-only queries while replaying WAL.
hot_standby = on
